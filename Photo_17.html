<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Resume Builder</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #1a2533;
            --accent: #6d8bb4;
            --white: #ffffff;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #d1d8e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 0;
            margin: 0;
        }

        /* Toolbar */
        #controls {
            background: white;
            padding: 15px 30px;
            border-radius: 50px;
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: sticky;
            top: 20px;
            z-index: 100;
        }

        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #eee;
            transition: 0.2s;
        }
        .color-dot:hover { transform: scale(1.2); }

        /* Resume Layout */
        #resume-canvas {
            width: 210mm; /* A4 Width */
            min-height: 297mm; /* A4 Height */
            background: white;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
        }

        /* Header Section */
        header {
            background-color: var(--primary);
            color: white;
            padding: 50px;
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .photo-area {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: #f0f0f0;
            border: 5px solid white;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .photo-area img { width: 100%; height: 100%; object-fit: cover; }
        .photo-text { color: #666; font-size: 12px; font-weight: bold; text-align: center; }

        .name-details { flex-grow: 1; }
        .name-details input {
            background: transparent;
            border: none;
            color: white;
            width: 100%;
            outline: none;
            margin-bottom: 5px;
        }
        .input-name { font-size: 38px; font-weight: bold; text-transform: uppercase; border-bottom: 1px dashed rgba(255,255,255,0.2) !important; }
        .input-job { font-size: 18px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.9; }

        .contact-grid { margin-top: 25px; }
        .contact-label {
            background: var(--accent);
            display: inline-block;
            padding: 5px 15px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        .contact-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 14px; }
        .contact-row input { border-bottom: 1px dashed rgba(255,255,255,0.2) !important; font-size: 13px; }

        /* Content Area */
        .resume-body { padding: 40px; flex-grow: 1; }
        .section { margin-bottom: 30px; }
        .section-head {
            background: var(--accent);
            color: white;
            padding: 8px 15px;
            font-weight: bold;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .add-btn {
            background: white;
            color: var(--accent);
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }

        textarea {
            width: 100%;
            border: 1px dashed #ccc;
            padding: 10px;
            font-family: inherit;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.6;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }

        /* Dynamic Entries */
        .entry { margin-bottom: 15px; position: relative; }
        .entry input { display: block; width: 100%; border: none; outline: none; }
        .entry .title { font-weight: bold; font-size: 15px; }
        .entry .subtitle { font-style: italic; color: #666; font-size: 13px; margin-bottom: 5px; }
        
        .points-list { list-style: none; padding-left: 15px; margin: 0; }
        .point-item { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 4px; }
        .point-item::before { content: "•"; color: var(--accent); font-weight: bold; }
        .point-item input { font-size: 13px; }

        /* Buttons & Footer */
        .footer-stripe { height: 40px; background: var(--accent); margin-top: auto; }

        .action-btns { margin: 40px; display: flex; gap: 15px; }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: 0.3s;
        }
        .btn-blue { background: #3498db; color: white; }
        .btn-green { background: #27ae60; color: white; }
        .btn-gray { background: #7f8c8d; color: white; }

        /* PREVIEW MODE OVERRIDES */
        .preview-mode .add-btn,
        .preview-mode #controls,
        .preview-mode .point-btn,
        .preview-mode input::placeholder,
        .preview-mode textarea::placeholder { display: none !important; }
        
        .preview-mode input, .preview-mode textarea { 
            border: none !important; 
            background: transparent !important; 
            pointer-events: none; 
        }

        .hidden { display: none !important; }
        .point-btn {
            font-size: 11px;
            background: #eee;
            border: none;
            padding: 2px 8px;
            cursor: pointer;
            border-radius: 10px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div id="controls">
        <span style="font-size: 13px; font-weight: bold; color: #666;">THEME:</span>
        <div class="color-dot" style="background: #1a2533;" onclick="setTheme('#1a2533', '#6d8bb4')"></div>
        <div class="color-dot" style="background: #2c3e50;" onclick="setTheme('#2c3e50', '#95a5a6')"></div>
        <div class="color-dot" style="background: #004d40;" onclick="setTheme('#004d40', '#4db6ac')"></div>
        <div class="color-dot" style="background: #3e2723;" onclick="setTheme('#3e2723', '#a1887f')"></div>
    </div>

    <div id="resume-canvas">
        <header id="headerPart">
            <div class="photo-area" onclick="document.getElementById('imgInput').click()">
                <input type="file" id="imgInput" class="hidden" accept="image/*" onchange="loadPhoto(this)">
                <div id="photoContent" class="photo-text">CLICK TO<br>UPLOAD PHOTO</div>
            </div>

            <div class="name-details">
                <input type="text" class="input-name" placeholder="Full Name">
                <input type="text" class="input-job" placeholder="Professional Title">
                
                <div class="contact-grid">
                    <div class="contact-label theme-accent">Contact</div>
                    <div class="contact-row"><span>📞</span><input type="text" placeholder="Phone Number"></div>
                    <div class="contact-row"><span>✉️</span><input type="text" placeholder="Email Address"></div>
                    <div class="contact-row"><span>🌐</span><input type="text" placeholder="Website/Portfolio"></div>
                    <div class="contact-row"><span>📍</span><input type="text" placeholder="Location"></div>
                </div>
            </div>
        </header>

        <div class="resume-body">
            <div class="section">
                <div class="section-head theme-accent">Profile</div>
                <textarea placeholder="Write a short summary of your career..."></textarea>
            </div>

            <div class="grid-2">
                <div class="col-left">
                    <div class="section">
                        <div class="section-head theme-accent">Education <button class="add-btn" onclick="addEntry('edu-list')">+</button></div>
                        <div id="edu-list"></div>
                    </div>
                    <div class="section">
                        <div class="section-head theme-accent">Skills <button class="add-btn" onclick="addPoint('skill-list')">+</button></div>
                        <div id="skill-list" class="points-list"></div>
                    </div>
                </div>
                <div class="col-right">
                    <div class="section">
                        <div class="section-head theme-accent">Work Experience <button class="add-btn" onclick="addEntry('work-list')">+</button></div>
                        <div id="work-list"></div>
                    </div>
                    <div class="section">
                        <div class="section-head theme-accent">Languages <button class="add-btn" onclick="addPoint('lang-list')">+</button></div>
                        <div id="lang-list" class="points-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer-stripe theme-accent"></div>
    </div>

    <div class="action-btns">
        <button id="preView" class="btn btn-blue" onclick="toggleView(true)">Preview Mode</button>
        <button id="editView" class="btn btn-gray hidden" onclick="toggleView(false)">Return to Edit</button>
        <button id="dlBtn" class="btn btn-green hidden" onclick="makePDF()">Download PDF</button>
    </div>

    <script>
        // Photo Loader
        function loadPhoto(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('photoContent').innerHTML = `<img src="${e.target.result}">`;
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // Add Multi-line Entry
        function addEntry(targetId) {
            const container = document.getElementById(targetId);
            const entry = document.createElement('div');
            entry.className = 'entry';
            entry.innerHTML = `
                <input type="text" class="title" placeholder="Position/Degree">
                <input type="text" class="subtitle" placeholder="Company/School | Dates">
                <div class="points-list"></div>
                <button class="point-btn" onclick="addPointToEntry(this)">+ point</button>
            `;
            container.appendChild(entry);
        }

        // Add Single Bullet Point
        function addPoint(targetId) {
            const container = document.getElementById(targetId);
            const point = document.createElement('div');
            point.className = 'point-item';
            point.innerHTML = `<input type="text" placeholder="Detail...">`;
            container.appendChild(point);
        }

        function addPointToEntry(btn) {
            const list = btn.previousElementSibling;
            const point = document.createElement('div');
            point.className = 'point-item';
            point.innerHTML = `<input type="text" placeholder="Achievement/Task...">`;
            list.appendChild(point);
        }

        // Theme Switcher
        function setTheme(p, a) {
            document.documentElement.style.setProperty('--primary', p);
            document.documentElement.style.setProperty('--accent', a);
            document.getElementById('headerPart').style.backgroundColor = p;
            document.querySelectorAll('.theme-accent').forEach(el => el.style.backgroundColor = a);
        }

        // View Management
        function toggleView(preview) {
            const body = document.body;
            if (preview) {
                body.classList.add('preview-mode');
                document.getElementById('preView').classList.add('hidden');
                document.getElementById('editView').classList.remove('hidden');
                document.getElementById('dlBtn').classList.remove('hidden');
                document.getElementById('controls').style.display = 'none';
            } else {
                body.classList.remove('preview-mode');
                document.getElementById('preView').classList.remove('hidden');
                document.getElementById('editView').classList.add('hidden');
                document.getElementById('dlBtn').classList.add('hidden');
                document.getElementById('controls').style.display = 'flex';
            }
        }

        // PDF Generation
        async function makePDF() {
            const element = document.getElementById('resume-canvas');
            const opt = {
                margin: 0,
                filename: 'My_Resume.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, letterRendering: true },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            
            try {
                await html2pdf().set(opt).from(element).save();
            } catch (err) {
                alert("PDF Generation error. Please check if your browser allows script execution.");
                console.error(err);
            }
        }

        // Init
        window.onload = () => {
            addEntry('edu-list');
            addEntry('work-list');
            addPoint('skill-list');
            addPoint('lang-list');
        };
    </script>
</body>
</html>
