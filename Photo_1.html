<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Italianno&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
    /* --- CSS Refactored & Minified --- */
    body { font-family: 'Montserrat', sans-serif; background: #f4f4f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1000px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1, h2, h3 { color: #222; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .section { border: 1px solid #ddd; padding: 15px; border-radius: 6px; margin-bottom: 15px; }
    label { display: block; margin: 10px 0 5px; font-size: 0.9em; font-weight: bold; }
    input, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    .btn-add { background: #ddd; color: #000; padding: 5px 10px; float: right; }
    .btn-primary { background: #f4dcd3; color: #000; font-size: 1.1em; width: 100%; }
    .btn-secondary { background: #444; color: #fff; }
    .error { border-color: red !important; }
    .alert { color: red; display: none; text-align: center; margin-bottom: 10px; font-weight: bold; }
    
    /* Dynamic Fields */
    .item-group { border-left: 3px solid #f4dcd3; padding-left: 10px; margin-bottom: 10px; position: relative; }
    .btn-remove { position: absolute; top: 0; right: 0; background: red; color: white; padding: 2px 6px; font-size: 12px; }

    /* --- Preview CSS --- */
    #preview-section { display: none; }
    .preview-wrapper { overflow: auto; background: #555; padding: 20px; display: flex; justify-content: center; }
    
    /* A4 Dimensions for PDF */
    #resume { width: 210mm; min-height: 297mm; background: #fff; display: grid; grid-template-columns: 35% 65%; box-shadow: 0 0 10px rgba(0,0,0,0.5); transform-origin: top center; }
    
    /* Left Column (Pink) */
    .left-col { background: #f4dcd3; padding: 40px 30px; word-break: break-word; }
    .photo-box { width: 160px; height: 160px; background: #fff; padding: 10px; margin: 0 auto 30px; }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; }
    .left-col h3 { border-bottom: 2px solid #fff; padding-bottom: 5px; font-size: 14px; letter-spacing: 2px; margin-top: 30px; text-transform: uppercase; }
    .left-col p, .left-col ul, .left-col li { font-size: 12px; line-height: 1.6; padding: 0; margin: 0 0 10px 0; }
    .left-col ul { padding-left: 15px; }

    /* Right Column (White) */
    .right-col { padding: 50px; }
    .name-script { font-family: 'Italianno', cursive; font-size: 70px; margin: 0 0 -20px 0; font-weight: normal; }
    .name-sans { font-size: 30px; letter-spacing: 3px; text-transform: uppercase; margin: 0; }
    .job-title { font-size: 14px; letter-spacing: 2px; border-bottom: 2px solid #eee; padding-bottom: 20px; margin-top: 10px; text-transform: uppercase; }
    
    .right-col h3 { background: #f4dcd3; display: inline-block; padding: 5px 15px; font-size: 14px; letter-spacing: 2px; margin-top: 30px; text-transform: uppercase; }
    .entry { margin-bottom: 20px; }
    .entry-header { display: flex; justify-content: space-between; font-weight: bold; font-size: 14px; text-transform: uppercase; }
    .entry-sub { font-style: italic; font-size: 13px; margin: 5px 0; }
    .entry-desc { font-size: 12px; line-height: 1.6; color: #444; }
</style>
</head>
<body>

<div class="container">
    <h1 id="main-title" style="text-align:center;">Designer CV Builder</h1>
    <div id="alert" class="alert">Please fill in all highlighted fields!</div>

    <div id="form-section">
        <form id="cv-form" class="grid">
            <div>
                <div class="section">
                    <label>Profile Photo (Square)</label>
                    <input type="file" id="f-photo" accept="image/*">
                </div>
                <div class="section">
                    <label>About Me</label>
                    <textarea id="f-about" rows="4" required>Passionate designer with a focus on architecture...</textarea>
                </div>
                <div class="section">
                    <h3>Contact</h3>
                    <label>Phone</label><input type="text" id="f-phone" required value="+123-456-7890">
                    <label>Email</label><input type="text" id="f-email" required value="hello@website.com">
                    <label>Website</label><input type="text" id="f-web" required value="www.website.com">
                    <label>Location</label><input type="text" id="f-loc" required value="Any City, ST 12345">
                </div>
                <div class="section">
                    <h3>Skills <button type="button" class="btn-add" onclick="addItem('skills')">+</button></h3>
                    <div id="skills-list"></div>
                </div>
                <div class="section">
                    <h3>Languages <button type="button" class="btn-add" onclick="addItem('langs')">+</button></h3>
                    <div id="langs-list"></div>
                </div>
            </div>

            <div>
                <div class="section">
                    <h3>Profile</h3>
                    <label>First Name</label><input type="text" id="f-fname" required value="Olivia">
                    <label>Last Name</label><input type="text" id="f-lname" required value="Wilson">
                    <label>Title</label><input type="text" id="f-title" required value="Designer and Architect">
                </div>
                <div class="section">
                    <h3>Experience <button type="button" class="btn-add" onclick="addExpEdu('exp')">+</button></h3>
                    <div id="exp-list"></div>
                </div>
                <div class="section">
                    <h3>Education <button type="button" class="btn-add" onclick="addExpEdu('edu')">+</button></h3>
                    <div id="edu-list"></div>
                </div>
            </div>
        </form>
        <button class="btn-primary" onclick="generateCV()">Preview & Download Resume</button>
    </div>

    <div id="preview-section">
        <div style="text-align: center; margin-bottom: 20px;">
            <button class="btn-secondary" onclick="editCV()">← Back to Edit</button>
            <button class="btn-primary" style="width:auto; margin-left:10px;" onclick="downloadPDF()">Download PDF</button>
        </div>

        <div class="preview-wrapper">
            <div id="resume">
                <div class="left-col">
                    <div class="photo-box"><img id="r-photo" src="" alt=""></div>
                    <h3>About Me</h3><p id="r-about"></p>
                    <h3>Contact</h3>
                    <p id="r-contact"></p>
                    <h3>Skills</h3><ul id="r-skills"></ul>
                    <h3>Languages</h3><ul id="r-langs"></ul>
                </div>
                <div class="right-col">
                    <h1 class="name-script" id="r-fname"></h1>
                    <h2 class="name-sans" id="r-lname"></h2>
                    <div class="job-title" id="r-title"></div>
                    
                    <h3>Work Experience</h3>
                    <div id="r-exp"></div>
                    
                    <h3>Education</h3>
                    <div id="r-edu"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// -- DYNAMIC FORM BUILDER LOGIC --
function addItem(type) {
    const div = document.createElement('div');
    div.className = 'item-group';
    div.innerHTML = `<input type="text" required placeholder="Entry..."> <button type="button" class="btn-remove" onclick="this.parentElement.remove()">X</button>`;
    document.getElementById(type + '-list').appendChild(div);
}

function addExpEdu(type) {
    const div = document.createElement('div');
    div.className = 'item-group';
    const isExp = type === 'exp';
    div.innerHTML = `
        <label>${isExp ? 'Job Title' : 'Degree'}</label><input type="text" class="t1" required>
        <label>${isExp ? 'Company' : 'Institution'}</label><input type="text" class="t2" required>
        <label>Dates</label><input type="text" class="t3" required>
        ${isExp ? `<label>Description</label><textarea class="t4" rows="2"></textarea>` : ''}
        <button type="button" class="btn-remove" onclick="this.parentElement.remove()">X</button>
    `;
    document.getElementById(type + '-list').appendChild(div);
}

// Pre-fill one of each on load
window.onload = () => { addItem('skills'); addItem('langs'); addExpEdu('exp'); addExpEdu('edu'); };

// -- GENERATE PREVIEW LOGIC --
function generateCV() {
    let isValid = true;
    document.querySelectorAll('input[required], textarea[required]').forEach(el => {
        el.classList.remove('error');
        if (!el.value.trim()) { el.classList.add('error'); isValid = false; }
    });

    if (!isValid) { document.getElementById('alert').style.display = 'block'; return; }
    document.getElementById('alert').style.display = 'none';

    // Image Setup
    const file = document.getElementById('f-photo').files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = e => document.getElementById('r-photo').src = e.target.result;
        reader.readAsDataURL(file);
    } else {
        // Transparent pixel to prevent PDF CORS error
        document.getElementById('r-photo').src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"; 
    }

    // Text Setup
    document.getElementById('r-about').innerText = document.getElementById('f-about').value;
    document.getElementById('r-contact').innerHTML = `
        ☎ ${document.getElementById('f-phone').value}<br>
        ✉ ${document.getElementById('f-email').value}<br>
        🌐 ${document.getElementById('f-web').value}<br>
        📍 ${document.getElementById('f-loc').value}
    `;
    document.getElementById('r-fname').innerText = document.getElementById('f-fname').value;
    document.getElementById('r-lname').innerText = document.getElementById('f-lname').value;
    document.getElementById('r-title').innerText = document.getElementById('f-title').value;

    // Lists Setup
    const getList = (id) => Array.from(document.getElementById(id).querySelectorAll('input')).map(i => i.value);
    document.getElementById('r-skills').innerHTML = getList('skills-list').map(v => `<li>${v}</li>`).join('');
    document.getElementById('r-langs').innerHTML = getList('langs-list').map(v => `<li>${v}</li>`).join('');

    // Exp / Edu Setup
    const populateComplex = (srcId, destId, isExp) => {
        const html = Array.from(document.getElementById(srcId).children).map(div => {
            const t1 = div.querySelector('.t1').value;
            const t2 = div.querySelector('.t2').value;
            const t3 = div.querySelector('.t3').value;
            const t4 = isExp ? div.querySelector('.t4').value : '';
            return `
                <div class="entry">
                    <div class="entry-header"><span>${t1}</span><span>${t3}</span></div>
                    <div class="entry-sub">${t2}</div>
                    ${isExp ? `<div class="entry-desc">${t4.replace(/\n/g, '<br>')}</div>` : ''}
                </div>`;
        }).join('');
        document.getElementById(destId).innerHTML = html;
    };
    
    populateComplex('exp-list', 'r-exp', true);
    populateComplex('edu-list', 'r-edu', false);

    // Swap Views
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('main-title').style.display = 'none';
    document.getElementById('preview-section').style.display = 'block';
}

function editCV() {
    document.getElementById('preview-section').style.display = 'none';
    document.getElementById('form-section').style.display = 'block';
    document.getElementById('main-title').style.display = 'block';
}

// -- PDF DOWNLOAD LOGIC --
function downloadPDF() {
    const element = document.getElementById('resume');
    const opt = {
        margin:       0,
        filename:     'Resume.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true }, 
        jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };
    html2pdf().set(opt).from(element).save();
}
</script>
</body>
</html>
